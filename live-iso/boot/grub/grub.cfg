set timeout=10
set default=0

insmod all_video

menuentry "NEXUS OS - Live (Network-Native)" {
    linux /boot/vmlinuz quiet nexus.live=1
    initrd /boot/initrd.img
}

menuentry "NEXUS OS - Live (Debug Mode)" {
    linux /boot/vmlinuz debug nexus.live=1 nexus.debug=1
    initrd /boot/initrd.img
}

menuentry "NEXUS OS - Install to Disk" {
    linux /boot/vmlinuz nexus.install=1
    initrd /boot/initrd.img
}

menuentry "Boot from Network (PXE)" {
    linux /boot/vmlinuz nexus.pxe=1
    initrd /boot/initrd.img
}
