# NEXUS OS Configuration

[identity]
# Cryptographic identity settings
key_file = /etc/nexus/identity.key
did_method = nexus
home_pod = auto  # auto, custom URL, or disabled

[network]
# Network-native settings
quic_enabled = true
http3_enabled = true
edge_cache_size_gb = 10
sync_interval_ms = 100

[filesystem]
# Content-addressed storage
chunk_size = 262144  # 256KB
deduplication = true
local_cache_gb = 10
pinning = home_pod  # home_pod, ipfs, filecoin, arweave

[runtime]
# WASM app runtime
sandbox = wasmtime
max_apps = 32
capability_default = deny

[agents]
# Background agent daemon
max_agents = 32
wake_on_intent = true
default_home = /var/nexus/agents

[ui]
# Network desktop
compositor = wayland
latency_adaptive = true
presence_aware = true
live_tiles = true

[gaming]
# Game streaming
state_sync = true
spectator_mode = ghost  # ghost, video, vr
asset_streaming = true
